<!-- Reference partial for a confirm-style modal. Toggle with .is-open on .modal-overlay. -->
<div class="modal-overlay" id="exampleModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exampleModalTitle">
    <div class="modal-header">
      <h4 id="exampleModalTitle">Confirm action</h4>
      <button class="btn-icon" data-modal-close aria-label="Close dialog">
        <i data-lucide="x" width="18" height="18"></i>
      </button>
    </div>
    <p>Are you sure you want to proceed? This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-modal-close>Cancel</button>
      <button class="btn btn-primary">Confirm</button>
    </div>
  </div>
</div>
