<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<title>Career Mentor & Jobs — CareerIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/variables.css">
<link rel="stylesheet" href="../styles/reset.css">
<link rel="stylesheet" href="../styles/global.css">
<link rel="stylesheet" href="../styles/layout.css">
<link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="../styles/animations.css">
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="../styles/responsive.css">
</head>
<body>
<div class="app-shell" data-sidebar-collapsed="false">
  <div data-mount="sidebar"></div>

  <div class="main-col">
    <div data-mount="topbar"></div>

    <main class="page-content" id="main">
      <div style="margin-bottom: var(--space-6);">
        <h2>Career Mentor & Jobs</h2>
        <p>Ask your AI mentor anything, then browse roles matched to your profile.</p>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab-btn is-active" id="tab-mentor" data-tab="mentor" role="tab" aria-controls="panel-mentor" aria-selected="true">AI Career Mentor</button>
        <button class="tab-btn" id="tab-jobs" data-tab="jobs" role="tab" aria-controls="panel-jobs" aria-selected="false" tabindex="-1">Job Hub</button>
      </div>

      <!-- TAB 1: Mentor -->
      <section class="tab-panel is-active" id="panel-mentor" role="tabpanel" aria-labelledby="tab-mentor" tabindex="0">
        <div style="display:grid; grid-template-columns: 1fr 300px; gap: var(--space-5); align-items:start;">
          <div class="card" style="display:flex; flex-direction:column; height: 620px;">
            <div id="chat-messages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap: var(--space-4); padding-right: var(--space-2);"></div>

            <div id="suggested-questions" style="display:flex; flex-wrap:wrap; gap: var(--space-2); margin-block: var(--space-4);"></div>

            <form id="chat-form" style="display:flex; gap: var(--space-3); border-top:1px solid var(--border-subtle); padding-top: var(--space-4);">
              <input type="text" id="chat-input" placeholder="Ask your career mentor anything..." style="flex:1; padding: var(--space-3) var(--space-4); background: var(--surface-input); border:1px solid var(--border-subtle); border-radius: var(--radius-full); color:var(--text-primary);">
              <button type="submit" class="btn btn-primary btn-icon" style="border-radius: var(--radius-full);" aria-label="Send message">
                <i data-lucide="send" width="18" height="18"></i>
              </button>
            </form>
          </div>

          <div style="display:flex; flex-direction:column; gap: var(--space-5);">
            <div class="card">
              <div class="card-header"><h5 style="font-size:var(--text-sm);">Career documents</h5></div>
              <ul id="mentor-documents" style="display:flex; flex-direction:column; gap: var(--space-2);"></ul>
            </div>
            <div class="card">
              <div class="card-header"><h5 style="font-size:var(--text-sm);">Conversation history</h5></div>
              <ul id="mentor-history" style="display:flex; flex-direction:column; gap: var(--space-2);"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 2: Job Hub -->
      <section class="tab-panel" id="panel-jobs" role="tabpanel" aria-labelledby="tab-jobs" tabindex="0" hidden>
        <div class="card" style="margin-bottom: var(--space-6);">
          <div style="display:flex; gap: var(--space-4); flex-wrap:wrap; align-items:flex-end;">
            <div class="field" style="margin:0;">
              <label for="job-location-filter">Location</label>
              <select id="job-location-filter"><option value="">All locations</option></select>
            </div>
            <div class="field" style="margin:0;">
              <label for="job-remote-filter">Work type</label>
              <select id="job-remote-filter">
                <option value="">All</option>
                <option value="remote">Remote only</option>
                <option value="onsite">On-site only</option>
              </select>
            </div>
            <div class="field" style="margin:0; flex:1; min-width:180px;">
              <label for="job-search-input">Search</label>
              <input type="text" id="job-search-input" placeholder="Job title or company">
            </div>
          </div>
        </div>

        <div style="margin-bottom: var(--space-6);">
          <h5 style="margin-bottom: var(--space-3); font-size: var(--text-sm);">Trending skills</h5>
          <div style="display:flex; flex-wrap:wrap; gap: var(--space-2);" id="trending-skills"></div>
        </div>

        <div class="grid-2" id="jobs-grid"></div>
      </section>
    </main>
  </div>
</div>

<div data-mount="bottom-nav"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="../scripts/app.js"></script>
<script type="module" src="../scripts/navigation-init.js"></script>
<script type="module" src="../scripts/mentor-jobs.js"></script>
</body>
</html>
